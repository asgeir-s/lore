[package]
name = "lore"
version = "0.1.2"
edition = "2021"
default-run = "lore"

[lib]
name = "lore_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "lore"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
regex = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "process", "macros"] }
cpal = "0.17"
hound = "3.5"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tauri-plugin-clipboard-manager = "2"
webrtc-vad = "0.4"
sha2 = "0.10"
fs2 = "0.4"

# Keep content fingerprinting fast when validating multi-gigabyte models in dev.
[profile.dev.package.sha2]
opt-level = 3
